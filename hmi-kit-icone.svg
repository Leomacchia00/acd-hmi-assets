    <text x="50" y="106" fill="#9a9a9a" font-size="9" text-anchor="middle">routine</text>
  </g>
  <g transform="translate(180,360)">
    <rect width="100" height="120" rx="10" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="50" cy="44" r="22" fill="none" stroke="#ffb020" stroke-width="2.5"/>
    <path d="M40 50 h20 M50 34 v9" stroke="#ffb020" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="92" fill="#ffffff" font-size="11" text-anchor="middle">RISCHIO</text>
    <text x="50" y="106" fill="#9a9a9a" font-size="9" text-anchor="middle">azione suggerita</text>
  </g>
  <g transform="translate(300,360)">
    <rect width="100" height="120" rx="10" fill="#141414" stroke="#2a2a2a"/>
    <path d="M50 22 l26 44 h-52z" fill="none" stroke="#ff3b3b" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M50 36 v14 M50 55 v3" stroke="#ff3b3b" stroke-width="2.5" stroke-linecap="round"/>
