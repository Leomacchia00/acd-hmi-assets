    <text x="50" y="106" fill="#9a9a9a" font-size="9" text-anchor="middle">azione richiesta</text>
  </g>
  <g transform="translate(420,360)">
    <rect width="100" height="120" rx="10" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="50" cy="44" r="22" fill="none" stroke="#3ddc84" stroke-width="2.5"/>
    <path d="M39 44 l8 8 15-16" stroke="#3ddc84" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
