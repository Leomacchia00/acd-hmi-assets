  </g>
  <g transform="translate(540,556)">
    <rect width="100" height="80" rx="10" fill="#141414" stroke="#2a2a2a"/>
    <path d="M30 50 h8 M38 44 l4 -8 4 16 3 -8 M56 50 h6" stroke="#ff5e00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="70" fill="#9a9a9a" font-size="10" text-anchor="middle">Avviso vocale</text>
  </g>
  <g transform="translate(660,556)">
    <rect width="100" height="80" rx="10" fill="#141414" stroke="#2a2a2a"/>
    <path d="M34 40 h32 v14 h-32z M50 54 v6 M42 60 h16" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="70" fill="#9a9a9a" font-size="10" text-anchor="middle">Energia / freni</text>
  </g>

  <g transform="translate(800,160)">
    <rect width="340" height="476" rx="10" fill="#141414" stroke="#2a2a2a"/>
    <text x="20" y="40" fill="#ffffff" font-size="15" font-weight="bold">Principi del kit</text>
    <text x="20" y="66" fill="#9a9a9a" font-size="12">
      <tspan x="20" dy="0">1 · Griglia 48px, tratto 2.5px, terminali arrotondati</tspan>
      <tspan x="20" dy="22">2 · Una sola forma metaforica per concetto</tspan>
      <tspan x="20" dy="22">3 · Colore = stato, forma = oggetto:</tspan>
      <tspan x="20" dy="22">   mai usare il colore da solo (R3)</tspan>
      <tspan x="20" dy="34">4 · Bianco: azione del conducente</tspan>
      <tspan x="20" dy="22">   Arancione: automazione (GoA2)</tspan>
      <tspan x="20" dy="22">   Verde: OK · Ambra: rischio · Rosso: pericolo</tspan>
      <tspan x="20" dy="34">5 · Pedone/ostacolo sempre in rosso:</tspan>
      <tspan x="20" dy="22">   è l'urgenza massima dello scenario 02</tspan>
      <tspan x="20" dy="34">6 · Riconoscibilità a colpo d'occhio:</tspan>
      <tspan x="20" dy="22">   test a distanza di un metro</tspan>
    </text>
    <text x="20" y="330" fill="#ffffff" font-size="15" font-weight="bold">Da sviluppare</text>
    <text x="20" y="356" fill="#9a9a9a" font-size="12">
      <tspan x="20" dy="0">· Icone fermate / mappa linea</tspan>
      <tspan x="20" dy="22">· Icone passeggeri (assistenza, emergenza)</tspan>
      <tspan x="20" dy="22">· Varianti piccolo formato (barra stato)</tspan>
      <tspan x="20" dy="22">· Versione outline monocolore per stampa</tspan>
      <tspan x="20" dy="22">· Naming e asset export per Figma</tspan>
    </text>
  </g>
