  </g>
  <g transform="translate(180,556)">
    <rect width="100" height="80" rx="10" fill="#141414" stroke="#2a2a2a"/>
    <path d="M30 52 h40 M34 52 v-14 a16 16 0 0 1 32 0 v14" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
