    <text x="50" y="106" fill="#9a9a9a" font-size="9" text-anchor="middle">ostacolo classificato</text>
  </g>

  <text x="40" y="522" fill="#ff5e00" font-size="14" font-weight="bold" letter-spacing="2">OPERATORE E MEZZO</text>
  <text x="40" y="540" fill="#6a6a6a" font-size="11">porte, banchina, sala di controllo, meteo</text>

  <g transform="translate(60,556)">
    <rect width="100" height="80" rx="10" fill="#141414" stroke="#2a2a2a"/>
    <path d="M32 24 h36 v30 h-36z M50 54 v-6 M42 54 v-6" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
