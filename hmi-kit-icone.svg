<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1180" height="660" fill="#0a0a0a"/>
  <text x="40" y="52" fill="#ffffff" font-size="26" font-weight="bold">Kit icone HMI · primo studio</text>
  <text x="40" y="76" fill="#9a9a9a" font-size="13">Griglia 48px · tratto 2.5px · angoli arrotondati · palette deck: bianco, arancione #FF5E00, verde #3DDC84, ambra #FFB020, rosso #FF3B3B</text>

  <text x="40" y="122" fill="#ff5e00" font-size="14" font-weight="bold" letter-spacing="2">MODALITÀ E CONTROLLO</text>
  <text x="40" y="140" fill="#6a6a6a" font-size="11">R1 · chi ha il controllo</text>

  <g transform="translate(60,160)">
    <rect width="100" height="120" rx="10" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="50" cy="44" r="22" fill="none" stroke="#ff5e00" stroke-width="2.5"/>
